<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060612">
<title>Upward Drop - Test 3D Isometric</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:#030308;color:#fff;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;touch-action:none}
#gameContainer{position:relative;width:100%;max-width:420px;height:100%;max-height:850px;overflow:hidden;background:#050510}
canvas{display:block;width:100%;height:100%}
.screen{position:absolute;inset:0;background:rgba(5,5,16,.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;padding:15px}
.hidden{display:none!important}
h1{font-size:2.2rem;font-weight:900;letter-spacing:2px;margin:0 0 5px;background:linear-gradient(90deg,#00f3ff,#ff00cc);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(135deg,#00f3ff,#0066ff);border:none;padding:12px 24px;font-size:1rem;font-weight:800;border-radius:35px;color:#000;box-shadow:0 0 15px rgba(0,243,255,.5);cursor:pointer;margin:8px 0;width:80%;max-width:240px;text-align:center}
</style>
</head>
<body>
<div id="gameContainer">
  <div id="menuScreen" class="screen">
    <h1>UPWARD 3D</h1>
    <div style="color:#8899ac;font-size:.8rem;margin-bottom:15px">TEST DE RENDU PSEUDO-3D</div>
    <button class="btn" id="startBtn">JOUER EN 3D</button>
  </div>
  
  <div id="gameOverScreen" class="screen hidden">
    <h2 style="color:#ff007f">GAME OVER</h2>
    <div id="scoreText" style="margin-bottom:15px;font-weight:bold;color:#ffd700">SCORE : 0</div>
    <button class="btn" id="restartBtn">REESSAYER</button>
  </div>

  <canvas id="c"></canvas>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=360,H=640,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=canvas.clientWidth; H=canvas.clientHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
}
window.addEventListener('resize',resize);resize();

let state='MENU', score=0, T=0, cameraY=0;
const ball={x:W/2, y:H-120, r:12, vx:2, vy:-2.5, trail:[]};
let obstacles=[];

function spawnObstacle(y){
  const gw=100;
  const gx=40+Math.random()*(W-80-gw);
  obstacles.push({y:y, h:16, gx:gx, gw:gw});
}

function initGame(){
  score=0; T=0; ball.x=W/2; ball.y=H-120; ball.vx=2; ball.vy=-2.5; ball.trail=[];
  obstacles=[];
  cameraY=ball.y-H*.7;
  for(let y=H-250; y>cameraY-H; y-=200) spawnObstacle(y);
  state='PLAYING';
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
}

document.getElementById('startBtn').onclick=initGame;
document.getElementById('restartBtn').onclick=initGame;

window.addEventListener('pointerdown',(e)=>{
  if(e.target.tagName==='BUTTON') return;
  if(state==='PLAYING') ball.vx*=-1;
});

function step(){
  if(state!=='PLAYING') return;
  T++;
  ball.x+=ball.vx; ball.y+=ball.vy;
  
  ball.trail.push({x:ball.x, y:ball.y});
  if(ball.trail.length>18) ball.trail.shift();

  if(ball.x-ball.r<=10){ ball.x=ball.r+10; ball.vx=Math.abs(ball.vx); }
  if(ball.x+ball.r>=W-10){ ball.x=W-ball.r-10; ball.vx=-Math.abs(ball.vx); }

  cameraY+=((ball.y-H*.7)-cameraY)*0.1;
  score=Math.max(score, Math.floor(-ball.y/6));

  if(obstacles[obstacles.length-1].y > cameraY - H) {
    spawnObstacle(obstacles[obstacles.length-1].y - 200);
  }

  // Collisions
  obstacles.forEach(o=>{
    if(Math.abs(o.y - ball.y) < 14){
      if(ball.x - ball.r < o.gx || ball.x + ball.r > o.gx + o.gw){
        state='DEAD';
        document.getElementById('scoreText').innerText='SCORE : '+score;
        document.getElementById('gameOverScreen').classList.remove('hidden');
      }
    }
  });
}

// DESSIN AVEC EFFET DE RELIEF 3D ISOMETRIQUE
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#060612'; ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(0,-cameraY);

  // Murs latéraux 3D
  ctx.fillStyle='rgba(0,243,255,0.15)';
  ctx.fillRect(0, cameraY, 10, H+200);
  ctx.fillRect(W-10, cameraY, 10, H+200);

  ctx.strokeStyle='#00f3ff'; ctx.lineWidth=2;
  ctx.strokeRect(10, cameraY, 0, H+200);
  ctx.strokeRect(W-10, cameraY, 0, H+200);

  // Obstacles 3D (Face + Ombre/Profondeur)
  obstacles.forEach(o=>{
    if(o.y < cameraY-50 || o.y > cameraY+H+50) return;

    // Bloc Gauche (Profondeur 3D)
    ctx.fillStyle='#990044'; // Côté 3D sombre
    ctx.fillRect(10, o.y+6, o.gx-10, o.h);
    ctx.fillStyle='#ff0055'; // Face brillante
    ctx.fillRect(10, o.y, o.gx-10, o.h);

    // Bloc Droit (Profondeur 3D)
    ctx.fillStyle='#990044';
    ctx.fillRect(o.gx+o.gw, o.y+6, W-10-(o.gx+o.gw), o.h);
    ctx.fillStyle='#ff0055';
    ctx.fillRect(o.gx+o.gw, o.y, W-10-(o.gx+o.gw), o.h);
  });

  // Traînée 3D
  ball.trail.forEach((t,i)=>{
    ctx.fillStyle=`rgba(0,243,255,${i/18})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, (ball.r*i)/18, 0, 6.28); ctx.fill();
  });

  // Balle 3D avec ombre portée
  if(state==='PLAYING'){
    // Ombre sous la balle
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(ball.x+4, ball.y+6, ball.r, ball.r*0.6, 0, 0, 6.28); ctx.fill();

    // Balle Néon 3D (Dégradé sphérique)
    const g=ctx.createRadialGradient(ball.x-3, ball.y-3, 2, ball.x, ball.y, ball.r);
    g.addColorStop(0,'#ffffff');
    g.addColorStop(0.4,'#00f3ff');
    g.addColorStop(1,'#0066cc');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 6.28); ctx.fill();
  }

  ctx.restore();

  // Score HUD
  if(state==='PLAYING'){
    ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
    ctx.fillText(score, W/2, 40);
  }
}

function loop(){ step(); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
