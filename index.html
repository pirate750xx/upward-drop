<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Upward Drop - Synthwave Arcade</title>
<style>
  body {
    margin: 0;
    background: #05050a;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 850px;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #080816;
  }
  .screen {
    position: absolute;
    inset: 0;
    background: rgba(8, 8, 22, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .hidden {
    display: none !important;
  }
  h1 {
    font-size: 2.2rem;
    color: #ff007f;
    text-shadow: 0 0 15px #ff007f;
    margin-bottom: 5px;
    text-align: center;
  }
  p {
    color: #a0a0c0;
    margin-bottom: 25px;
    text-align: center;
    padding: 0 20px;
  }
  .btn {
    background: transparent;
    border: 2px solid #00f3ff;
    padding: 15px 40px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 30px;
    color: #00f3ff;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    cursor: pointer;
    margin: 10px 0;
    width: 80%;
    max-width: 250px;
    text-align: center;
    z-index: 20;
  }
  .btn-primary {
    background: linear-gradient(135deg, #00f3ff, #0066ff);
    color: #000;
    border: none;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <div id="menuScreen" class="screen">
    <h1>UPWARD DROP</h1>
    <p>Tape pour changer de direction, commence doucement et survis le plus longtemps possible !</p>
    <button class="btn btn-primary" id="startBtn">JOUER</button>
  </div>

  <div id="gameOverScreen" class="screen hidden">
    <h1>GAME OVER</h1>
    <p id="finalScoreText" style="font-size: 1.3rem; color: #fff; margin-bottom: 10px;">Score : 0</p>
    <p id="finalCoinsText" style="color: #ffd700; margin-bottom: 25px;">Pièces : 0</p>
    <button class="btn btn-primary" id="restartBtn">REJOUER</button>
    <button class="btn" id="menuBtn">MENU</button>
  </div>

  <canvas id="c"></canvas>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

let state = 'MENU';
let score = 0;
let coins = parseInt(localStorage.getItem('upward_coins')) || 0;
let bestScore = parseInt(localStorage.getItem('upward_best')) || 0;
let cameraY = 0;

let ball = {
  x: canvas.width / 2,
  y: canvas.height - 100,
  r: 10,
  vx: 1.8,  // Vitesse de départ très douce
  vy: -2.5, // Montée lente et maîtrisée
  trail: []
};

let obstacles = [];
let items = [];
let stars = [];
let colorHue = 180;

for(let i=0; i<60; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 0.6 + 0.2,
    shooting: Math.random() > 0.8,
    length: 25 + Math.random() * 25
  });
}

function initGame() {
  score = 0;
  cameraY = 0;
  ball.x = canvas.width / 2;
  ball.y = canvas.height - 100;
  ball.vx = 1.8;
  ball.vy = -2.5;
  ball.trail = [];
  obstacles = [];
  items = [];

  // Barres espacées généreusement au départ pour un Niveau 1 très accessible
  for(let i = 0; i < 5; i++) {
    spawnObstacle(canvas.height - 300 - (i * 260), i);
  }
}

function spawnObstacle(yPos, index) {
  let currentLevel = Math.floor(score / 40) + 1;
  let type = 0;

  // Variété d'obstacles qui n'apparaît qu'après le niveau 3 ou 4
  if (currentLevel >= 4) {
    let rand = Math.random();
    if (rand < 0.5) type = 0;
    else if (rand < 0.8) type = 1;
    else type = 2;
  }

  let obs = { y: yPos, h: 14, type: type, parts: [] };

  if (type === 0) {
    let gapWidth = Math.max(120 - (currentLevel * 2), 80);
    let gapX = Math.random() * (canvas.width - gapWidth - 60) + 30;
    obs.parts.push({ x: 15, w: gapX - 15 });
    obs.parts.push({ x: gapX + gapWidth, w: (canvas.width - 15) - (gapX + gapWidth) });

    if (Math.random() > 0.3) {
      items.push({ x: gapX + gapWidth / 2, y: yPos - 40, r: 8, collected: false });
    }
  } 
  else if (type === 1) {
    let w1 = 70 + Math.random() * 30;
    let w2 = 70 + Math.random() * 30;
    obs.parts.push({ x: 15, w: w1 });
    obs.parts.push({ x: canvas.width - 15 - w2, w: w2 });

    if (Math.random() > 0.4) {
      items.push({ x: canvas.width / 2, y: yPos - 40, r: 8, collected: false });
    }
  } 
  else {
    let centerW = Math.max(80 - (currentLevel * 2), 45);
    let centerX = (canvas.width - centerW) / 2;
    obs.parts.push({ x: centerX, w: centerW });

    if (Math.random() > 0.3) {
      items.push({ x: centerX - 35, y: yPos - 40, r: 8, collected: false });
      items.push({ x: centerX + centerW + 35, y: yPos - 40, r: 8, collected: false });
    }
  }

  obstacles.push(obs);
}

function startGame(e) {
  if(e) e.preventDefault();
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  initGame();
  state = 'PLAYING';
}

function showMenu(e) {
  if(e) e.preventDefault();
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
  state = 'MENU';
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('startBtn').addEventListener('touchstart', startGame);

document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('touchstart', startGame);

document.getElementById('menuBtn').addEventListener('click', showMenu);
document.getElementById('menuBtn').addEventListener('touchstart', showMenu);

window.addEventListener('pointerdown', (e) => {
  if(state === 'PLAYING' && !e.target.closest('button')) {
    ball.vx *= -1;
  }
});

function update() {
  if (state !== 'PLAYING') return;

  // Accélération extrêmement douce : la vitesse ne commence à monter qu'après un gros score
  let speedMult = 1 + (score / 1200); 
  let currentDir = Math.sign(ball.vx) || 1;
  ball.vx = currentDir * (1.8 * speedMult);
  ball.vy = -2.5 * speedMult;

  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.trail.push({x: ball.x, y: ball.y});
  if(ball.trail.length > 12) ball.trail.shift();

  let currentHeightScore = Math.floor(-ball.y / 6);
  if (currentHeightScore > score) score = currentHeightScore;

  colorHue = (180 + Math.floor(score / 50) * 20) % 360;

  if (ball.x - ball.r <= 15) {
    ball.x = 15 + ball.r;
    ball.vx = Math.abs(ball.vx);
  } else if (ball.x + ball.r >= canvas.width - 15) {
    ball.x = canvas.width - 15 - ball.r;
    ball.vx = -Math.abs(ball.vx);
  }

  let targetCameraY = ball.y - canvas.height * 0.45;
  cameraY += (targetCameraY - cameraY) * 0.1;

  let lastY = obstacles.length > 0 ? obstacles[obstacles.length - 1].y : cameraY;
  if(lastY > cameraY - canvas.height) {
    let spacing = Math.max(260 - (score / 8), 190);
    spawnObstacle(lastY - spacing, obstacles.length);
  }

  obstacles = obstacles.filter(o => o.y < cameraY + canvas.height + 100);
  items = items.filter(it => it.y < cameraY + canvas.height + 100);

  items.forEach(it => {
    if (!it.collected) {
      let dist = Math.hypot(ball.x - it.x, ball.y - it.y);
      if (dist < ball.r + it.r) {
        it.collected = true;
        coins++;
        localStorage.setItem('upward_coins', coins);
      }
    }
  });

  obstacles.forEach(o => {
    if (ball.y + ball.r > o.y && ball.y - ball.r < o.y + o.h) {
      o.parts.forEach(part => {
        if (ball.x + ball.r > part.x && ball.x - ball.r < part.x + part.w) {
          state = 'GAMEOVER';
          if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('upward_best', bestScore);
          }
          document.getElementById('finalScoreText').innerText = "Score : " + score;
          document.getElementById('finalCoinsText').innerText = "Pièces gagnées : " + coins;
          document.getElementById('gameOverScreen').classList.remove('hidden');
        }
      });
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#080816';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
    if(s.shooting) {
      ctx.strokeStyle = `hsl(${colorHue}, 100%, 70%)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.length, s.y - s.length);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
  });

  ctx.save();
  ctx.translate(0, -cameraY);

  ctx.strokeStyle = `hsl(${colorHue}, 100%, 50%)`;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(15, cameraY);
  ctx.lineTo(15, cameraY + canvas.height);
  ctx.moveTo(canvas.width - 15, cameraY);
  ctx.lineTo(canvas.width - 15, cameraY + canvas.height);
  ctx.stroke();

  obstacles.forEach(o => {
    ctx.fillStyle = '#ff007f';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ff007f';
    o.parts.forEach(part => {
      ctx.fillRect(part.x, o.y, part.w, o.h);
    });
    ctx.shadowBlur = 0;
  });

  items.forEach(it => {
    if (!it.collected) {
      ctx.fillStyle = '#ffd700';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ffd700';
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  });

  for(let i=0; i<ball.trail.length; i++) {
    let t = ball.trail[i];
    let alpha = i / ball.trail.length;
    ctx.fillStyle = `hsla(${colorHue}, 100%, 50%, ${alpha * 0.5})`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * (i / ball.trail.length), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#ffffff';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#00f3ff';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();

  if (state === 'PLAYING') {
    ctx.fillStyle = 'rgba(8, 8, 22, 0.85)';
    ctx.fillRect(15, 15, 90, 40);
    ctx.strokeStyle = `hsl(${colorHue}, 100%, 50%)`;
    ctx.lineWidth = 2;
    ctx.strokeRect(15, 15, 90, 40);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(score, 60, 42);

    let currentLevel = Math.floor(score / 40) + 1;
    ctx.fillStyle = 'rgba(8, 8, 22, 0.85)';
    ctx.fillRect(canvas.width - 145, 15, 130, 40);
    ctx.strokeRect(canvas.width - 145, 15, 130, 40);

    ctx.fillStyle = '#ff007f';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(`NIV.${currentLevel}`, canvas.width - 80, 41);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
