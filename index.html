<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Upward Drop - Synthwave Gold</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #030308;
    color: #fff;
    font-family: 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    touch-action: none;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 850px;
    box-shadow: 0 0 40px rgba(0, 243, 255, 0.25);
    overflow: hidden;
    background: #060612;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .screen {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 16, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    padding: 20px;
  }
  .hidden { display: none !important; }
  h1 {
    font-size: 2.5rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: #00f3ff;
    text-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
    margin: 0 0 5px 0;
    text-align: center;
  }
  .subtitle {
    color: #8899ac;
    font-size: 0.95rem;
    margin-bottom: 25px;
    text-align: center;
  }
  .stat-badge {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 243, 255, 0.3);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 1rem;
    font-weight: bold;
    color: #ffd700;
    margin-bottom: 12px;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
  }
  .btn {
    background: transparent;
    border: 2px solid #00f3ff;
    padding: 16px 45px;
    font-size: 1.15rem;
    font-weight: 800;
    border-radius: 35px;
    color: #00f3ff;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    cursor: pointer;
    margin: 8px 0;
    width: 85%;
    max-width: 260px;
    text-align: center;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #00f3ff, #0066ff);
    color: #000;
    border: none;
    box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
  }
  .btn:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="gameContainer">
  <div id="menuScreen" class="screen">
    <h1>UPWARD DROP</h1>
    <div class="subtitle">TAP POUR CHANGER DE DIRECTION</div>
    <div class="stat-badge" id="menuBestBadge">RECORD À BATTRE : 0</div>
    <div class="stat-badge" style="color: #ffd700; border-color: rgba(255, 215, 0, 0.4);" id="menuCoinsBadge">PIÈCES : 0</div>
    <button class="btn btn-primary" id="startBtn">JOUER</button>
  </div>

  <div id="gameOverScreen" class="screen hidden">
    <h1 style="color: #ff007f; text-shadow: 0 0 20px #ff007f;">GAME OVER</h1>
    <div class="stat-badge" style="color: #fff; border-color: #ff007f;" id="finalScoreText">SCORE : 0</div>
    <div class="stat-badge" style="color: #00f3ff;" id="bestScoreText">MEILLEUR RECORD : 0</div>
    <div class="stat-badge" style="color: #ffd700;" id="finalCoinsText">PIÈCES TOTALES : 0</div>
    <button class="btn btn-primary" id="restartBtn">REJOUER</button>
    <button class="btn" id="menuBtn">MENU</button>
  </div>

  <canvas id="c"></canvas>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

let state = 'MENU';
let score = 0;
let coins = parseInt(localStorage.getItem('upward_coins')) || 0;
let bestScore = parseInt(localStorage.getItem('upward_best')) || 0;
let cameraY = 0;

const WORLDS = [
  { name: "CYAN NEON", hue: 180, bg: '#060612' },
  { name: "MAGENTA SYNTH", hue: 320, bg: '#100512' },
  { name: "GOLDEN AMBER", hue: 45, bg: '#120f05' },
  { name: "PURPLE MATRIX", hue: 270, bg: '#0b0512' },
  { name: "EMERALD GRID", hue: 140, bg: '#05120a' }
];

let currentWorld = WORLDS[0];

let ball = {
  x: canvas.width / 2,
  y: canvas.height - 100,
  r: 9,
  vx: 1.3,
  vy: -2.0,
  trail: []
};

let obstacles = [];
let items = [];
let stars = [];

for(let i = 0; i < 70; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 0.5 + 0.1,
    shooting: Math.random() > 0.85,
    length: 20 + Math.random() * 30
  });
}

function updateBadges() {
  document.getElementById('menuBestBadge').innerText = "RECORD À BATTRE : " + bestScore;
  document.getElementById('menuCoinsBadge').innerText = "PIÈCES TOTALES : " + coins;
}
updateBadges();

function initGame() {
  score = 0;
  cameraY = 0;
  ball.x = canvas.width / 2;
  ball.y = canvas.height - 120;
  ball.vx = 1.3;
  ball.vy = -2.0;
  ball.trail = [];
  
  obstacles = [];
  items = [];
  currentWorld = WORLDS[0];

  for(let i = 0; i < 5; i++) {
    spawnObstacle(canvas.height - 300 - (i * 250), i);
  }
}

function spawnObstacle(yPos, index) {
  let level = Math.floor(score / 40) + 1;
  
  // Diversification des formes selon un cycle ou aléatoire intelligent
  let type = index % 3; 
  if (level >= 3) {
    type = Math.floor(Math.random() * 3); // 0: Trou milieu, 1: Slalom gauche/droite, 2: Blocs multiples
  }

  let obs = { y: yPos, h: 14, type: type, parts: [] };

  if (type === 0) {
    // Type 0 : Barre avec une ouverture centrale
    let gapWidth = Math.max(130 - (level * 2), 80);
    let gapX = 40 + Math.random() * (canvas.width - gapWidth - 80);
    obs.parts.push({ x: 15, w: gapX - 15 });
    obs.parts.push({ x: gapX + gapWidth, w: (canvas.width - 15) - (gapX + gapWidth) });

    if (Math.random() > 0.3) {
      items.push({ x: gapX + gapWidth / 2, y: yPos - 45, r: 8, collected: false });
    }
  } 
  else if (type === 1) {
    // Type 1 : Style Slalom (passage sur les côtés ou alterné)
    let sideChoice = Math.random() > 0.5 ? 'left' : 'right';
    if (sideChoice === 'left') {
      obs.parts.push({ x: 15, w: 90 + Math.random() * 30 }); // Bloque tout à gauche, passage à droite
    } else {
      let rightW = 90 + Math.random() * 30;
      obs.parts.push({ x: canvas.width - 15 - rightW, w: rightW }); // Bloque tout à droite, passage à gauche
    }

    if (Math.random() > 0.3) {
      items.push({ x: canvas.width / 2, y: yPos - 45, r: 8, collected: false });
    }
  } 
  else {
    // Type 2 : Double blocs / Pilier central
    let centerW = Math.max(80 - (level * 1.5), 45);
    let centerX = (canvas.width - centerW) / 2;
    obs.parts.push({ x: centerX, w: centerW });

    if (Math.random() > 0.3) {
      items.push({ x: centerX - 35, y: yPos - 45, r: 8, collected: false });
      items.push({ x: centerX + centerW + 35, y: yPos - 45, r: 8, collected: false });
    }
  }

  obstacles.push(obs);
}

function startGame(e) {
  if(e) e.preventDefault();
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  initGame();
  state = 'PLAYING';
}

function showMenu(e) {
  if(e) e.preventDefault();
  updateBadges();
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
  state = 'MENU';
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;
document.getElementById('menuBtn').onclick = showMenu;

window.addEventListener('pointerdown', (e) => {
  if(state === 'PLAYING' && !e.target.closest('button')) {
    ball.vx *= -1;
  }
});

function update() {
  if (state !== 'PLAYING') return;

  // Accélération très progressive
  let speedMult = 1 + (score / 1800); 
  let currentDir = Math.sign(ball.vx) || 1;
  ball.vx = currentDir * (1.3 * speedMult);
  ball.vy = -2.0 * speedMult;

  ball.x += ball.vx;
  ball.y += ball.vy;

  ball.trail.push({x: ball.x, y: ball.y});
  if(ball.trail.length > 16) ball.trail.shift();

  let currentHeightScore = Math.floor(-ball.y / 6);
  if (currentHeightScore > score) score = currentHeightScore;

  let worldIndex = Math.floor(score / 120) % WORLDS.length;
  currentWorld = WORLDS[worldIndex];

  if (ball.x - ball.r <= 15) {
    ball.x = 15 + ball.r;
    ball.vx = Math.abs(ball.vx);
  } else if (ball.x + ball.r >= canvas.width - 15) {
    ball.x = canvas.width - 15 - ball.r;
    ball.vx = -Math.abs(ball.vx);
  }

  // Caméra abaissée à 58% pour laisser de l'espace visuel au-dessus de la balle
  let targetCameraY = ball.y - canvas.height * 0.58;
  cameraY += (targetCameraY - cameraY) * 0.1;

  let lastY = obstacles.length > 0 ? obstacles[obstacles.length - 1].y : cameraY;
  if(lastY > cameraY - canvas.height) {
    let spacing = Math.max(260 - (score / 12), 200);
    spawnObstacle(lastY - spacing, obstacles.length);
  }

  obstacles = obstacles.filter(o => o.y < cameraY + canvas.height + 100);
  items = items.filter(it => it.y < cameraY + canvas.height + 100);

  items.forEach(it => {
    if (!it.collected) {
      let dist = Math.hypot(ball.x - it.x, ball.y - it.y);
      if (dist < ball.r + it.r) {
        it.collected = true;
        coins++;
        localStorage.setItem('upward_coins', coins);
      }
    }
  });

  obstacles.forEach(o => {
    if (ball.y + ball.r > o.y && ball.y - ball.r < o.y + o.h) {
      o.parts.forEach(part => {
        if (ball.x + ball.r > part.x && ball.x - ball.r < part.x + part.w) {
          state = 'GAMEOVER';
          if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('upward_best', bestScore);
          }
          document.getElementById('finalScoreText').innerText = "SCORE : " + score;
          document.getElementById('bestScoreText').innerText = "MEILLEUR RECORD : " + bestScore;
          document.getElementById('finalCoinsText').innerText = "PIÈCES TOTALES : " + coins;
          document.getElementById('gameOverScreen').classList.remove('hidden');
        }
      });
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = currentWorld.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
    if(s.shooting) {
      ctx.strokeStyle = `hsl(${currentWorld.hue}, 100%, 70%)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.length, s.y - s.length);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
  });

  ctx.save();
  ctx.translate(0, -cameraY);

  ctx.strokeStyle = `hsl(${currentWorld.hue}, 100%, 50%)`;
  ctx.lineWidth = 4;
  ctx.shadowBlur = 12;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.beginPath();
  ctx.moveTo(15, cameraY);
  ctx.lineTo(15, cameraY + canvas.height);
  ctx.moveTo(canvas.width - 15, cameraY);
  ctx.lineTo(canvas.width - 15, cameraY + canvas.height);
  ctx.stroke();
  ctx.shadowBlur = 0;

  obstacles.forEach(o => {
    ctx.fillStyle = `hsl(${(currentWorld.hue + 140) % 360}, 100%, 60%)`;
    ctx.shadowBlur = 12;
    ctx.shadowColor = ctx.fillStyle;
    o.parts.forEach(part => {
      ctx.fillRect(part.x, o.y, part.w, o.h);
    });
    ctx.shadowBlur = 0;
  });

  items.forEach(it => {
    if (!it.collected) {
      ctx.fillStyle = '#ffd700';
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#ffd700';
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  });

  for(let i = 0; i < ball.trail.length; i++) {
    let t = ball.trail[i];
    let ratio = i / ball.trail.length;
    ctx.fillStyle = `hsla(${currentWorld.hue}, 100%, 60%, ${ratio * 0.6})`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * ratio, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#ffffff';
  ctx.shadowBlur = 20;
  ctx.shadowColor = `hsl(${currentWorld.hue}, 100%, 50%)`;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();

  if (state === 'PLAYING') {
    let currentLevel = Math.floor(score / 50) + 1;

    ctx.fillStyle = 'rgba(5, 5, 16, 0.85)';
    ctx.fillRect(20, 20, 100, 38);
    ctx.strokeStyle = `hsl(${currentWorld.hue}, 100%, 50%)`;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(20, 20, 100, 38);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`SCORE ${score}`, 70, 44);

    ctx.fillStyle = 'rgba(5, 5, 16, 0.85)';
    ctx.fillRect(canvas.width - 150, 20, 130, 38);
    ctx.strokeRect(canvas.width - 150, 20, 130, 38);

    ctx.fillStyle = `hsl(${currentWorld.hue}, 100%, 70%)`;
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(`NIV.${currentLevel} - MONDE`, canvas.width - 85, 44);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
